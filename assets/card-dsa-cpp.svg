<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 220" width="410" height="220" fill="none">
  <title>DSA in Modern C++</title>
  <defs>
    <linearGradient id="cbg_card-dsa-cpp" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="laser-h_card-dsa-cpp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="laser-v_card-dsa-cpp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
      <animate attributeName="y1" values="-100%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0%;200%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cg_card-dsa-cpp" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg_card-dsa-cpp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pd_card-dsa-cpp{0%,100%{r:3;opacity:1}50%{r:5;opacity:0.2}}
    .dp_card-dsa-cpp{ animation:pd_card-dsa-cpp 2.3s ease-in-out infinite; }
  </style>

  <!-- Card base -->
  <rect x="0.5" y="0.5" width="409" height="219" rx="14" fill="url(#cbg_card-dsa-cpp)" stroke="#21262d" stroke-width="1"/>
  <rect width="410" height="220" rx="14" fill="url(#cg_card-dsa-cpp)"/>

  <!-- Border laser runners -->
  <line x1="14" y1="1" x2="396" y2="1" stroke="url(#laser-h_card-dsa-cpp)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1" y1="14" x2="1" y2="206" stroke="url(#laser-v_card-dsa-cpp)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pulsing dot -->
  <circle cx="20" cy="20" r="3" fill="#00f0ff" class="dp_card-dsa-cpp"/>
  <circle cx="20" cy="20" r="1.5" fill="#ffffff"/>

  <!-- Category badge -->
  <rect x="34" y="12" width="160" height="18" rx="9" fill="rgba(255,255,255,0.05)" stroke="#30363d" stroke-width="0.75"/>
  <text x="114" y="24.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#34d399">ALGORITHMS · MIRAI</text>

  <!-- Status / Live badge (Top Right) -->
  <rect x="320" y="12" width="76" height="18" rx="9" fill="rgba(255,255,255,0.05)" stroke="#30363d" stroke-width="0.75"/>
  <circle cx="330" cy="21" r="2.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="360" y="24.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" font-weight="700" letter-spacing="1" fill="#10b981">CORE C++</text>

  <!-- Title -->
  <text x="24" y="74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="url(#tg_card-dsa-cpp)">DSA in Modern C++</text>

  <!-- Description -->
  <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8b949e">
    <tspan x="24" y="104">Systematic implementations of core algorithms &amp; data structures.</tspan>
    <tspan x="24" y="124">Advanced trees, graphs, dynamic programming, and STL optimization.</tspan>
  </text>

  <!-- Tech tags line -->
  <line x1="24" y1="152" x2="386" y2="152" stroke="#21262d" stroke-width="0.75"/>

  <!-- Pills -->
  
    <rect x="24" y="172" width="54" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#30363d" stroke-width="0.8"/>
    <text x="51.0" y="186.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#adbac7">C++20</text>
    <rect x="86" y="172" width="104" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#30363d" stroke-width="0.8"/>
    <text x="138.0" y="186.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#adbac7">Data Structures</text>
    <rect x="198" y="172" width="82" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#30363d" stroke-width="0.8"/>
    <text x="239.0" y="186.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#adbac7">Algorithms</text>
</svg>