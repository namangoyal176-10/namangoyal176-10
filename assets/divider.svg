<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="100%" height="100%">
  <defs>
    <linearGradient id="divLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080B0A" stop-opacity="0" />
      <stop offset="15%" stop-color="#26362F" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00A878" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00D492" stop-opacity="1" />
      <stop offset="60%" stop-color="#00A878" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#26362F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#080B0A" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="divSubLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26362F" stop-opacity="0" />
      <stop offset="25%" stop-color="#26362F" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00D492" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#26362F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#26362F" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono-div { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; }
  </style>

  <!-- Secondary subtle baseline -->
  <line x1="120" y1="24" x2="1080" y2="24" stroke="url(#divSubLineGrad)" stroke-width="3" />

  <!-- Primary razor sharp axis line -->
  <line x1="60" y1="24" x2="1140" y2="24" stroke="url(#divLineGrad)" stroke-width="1.2" />

  <!-- Terminal Ticks along the axis -->
  <g stroke="#26362F" stroke-width="1" opacity="0.75">
    <line x1="200" y1="18" x2="200" y2="30" />
    <line x1="320" y1="20" x2="320" y2="28" />
    <line x1="440" y1="20" x2="440" y2="28" />
    <line x1="760" y1="20" x2="760" y2="28" />
    <line x1="880" y1="20" x2="880" y2="28" />
    <line x1="1000" y1="18" x2="1000" y2="30" />
  </g>

  <!-- Left Coordinate Bracket -->
  <path d="M 180 18 L 170 18 L 170 30 L 180 30" fill="none" stroke="#00A878" stroke-width="1" opacity="0.6" />
  <path d="M 1020 18 L 1030 18 L 1030 30 L 1020 30" fill="none" stroke="#00A878" stroke-width="1" opacity="0.6" />

  <!-- Center Terminal Reticle Pill -->
  <g transform="translate(600, 24)">
    <!-- Center Pill Frame -->
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#121C18" stroke="#26362F" stroke-width="1.2" />
    <rect x="-81" y="-8" width="162" height="16" rx="8" fill="#080B0A" stroke="#00D492" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Pulse Diamond -->
    <polygon points="-65,0 -61,-4 -57,0 -61,4" fill="#00D492" filter="url(#divGlow)" />

    <!-- Text -->
    <text x="5" y="4" text-anchor="middle" class="mono-div" font-size="10" font-weight="700" fill="#F1F5F3" letter-spacing="1.5">
      SYS // 0xNG
    </text>

    <!-- Right Pulse Dot -->
    <circle cx="62" cy="0" r="2.5" fill="#00D492" filter="url(#divGlow)" />
  </g>
</svg>