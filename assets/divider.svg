<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="100%" height="100%">
  <defs>
    <!-- Multi-Color Energy Beam Gradient -->
    <linearGradient id="rainbowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060714" stop-opacity="0" />
      <stop offset="15%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="1" />
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="85%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#060714" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <filter id="divRepulsorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b1" />
      <feGaussianBlur stdDeviation="7" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .div-mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; }

    @keyframes photonSlide {
      0% { transform: translateX(80px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(1120px); opacity: 0; }
    }
    .photon-pulse {
      animation: photonSlide 4s ease-in-out infinite;
    }

    @keyframes pillBreathe {
      0%, 100% { opacity: 0.92; filter: drop-shadow(0 0 4px #00f0ff); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #ec4899); }
    }
    .center-pill {
      animation: pillBreathe 2.8s ease-in-out infinite;
    }
  </style>

  <!-- Multi-Color Energy Axis Line -->
  <line x1="50" y1="24" x2="1150" y2="24" stroke="url(#rainbowLine)" stroke-width="2" />

  <!-- Animated Traveling Photon Energy Pulse -->
  <g class="photon-pulse">
    <ellipse cx="0" cy="24" rx="26" ry="2.5" fill="#ffffff" filter="url(#divRepulsorGlow)" />
    <circle cx="0" cy="24" r="4" fill="#00f0ff" filter="url(#divRepulsorGlow)" />
  </g>

  <!-- Left &amp; Right Colorful Chevron Arrows -->
  <path d="M 175 16 L 165 24 L 175 32" fill="none" stroke="#00f0ff" stroke-width="2.2" opacity="0.9" />
  <path d="M 1025 16 L 1035 24 L 1025 32" fill="none" stroke="#ff0055" stroke-width="2.2" opacity="0.9" />

  <!-- Center Avengers Emblem Reticle (Generous 270px width) -->
  <g transform="translate(600, 24)" class="center-pill">
    <rect x="-135" y="-15" width="270" height="30" rx="15" fill="#0e0b29" stroke="url(#pillBorderGrad)" stroke-width="1.8" />
    <rect x="-131" y="-11" width="262" height="22" rx="11" fill="#060714" />

    <!-- Avengers Tiny Icon -->
    <circle cx="-105" cy="0" r="7.5" fill="none" stroke="#00f0ff" stroke-width="1.4" />
    <path d="M -105 -5 L -102 5 L -104 5 L -105 2 L -107 2 L -108 5 L -110 5 Z" fill="#ffffff" />
    <line x1="-105" y1="2" x2="-98" y2="2" stroke="#ff0055" stroke-width="1.2" />

    <text x="2" y="5" text-anchor="middle" class="div-mono" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2px">
      <tspan fill="#00f0ff">AVENGERS</tspan> <tspan fill="#8b5cf6">//</tspan> <tspan fill="#ff0077">ASSEMBLE</tspan>
    </text>

    <!-- Arc Reactor Core Dot -->
    <circle cx="106" cy="0" r="4" fill="#00f0ff" filter="url(#divRepulsorGlow)" />
  </g>
</svg>