<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1022" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Topbar Gradient -->
    <linearGradient id="topbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#192642" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Arc Reactor Core Glow -->
    <radialGradient id="arcGlowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="reactorAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="redAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Filter Glows -->
    <filter id="arcGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b1" />
      <feGaussianBlur stdDeviation="10" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .f-mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; }
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px #00f0ff); }
    }
    .arc-core-anim {
      transform-origin: 990px 165px;
      animation: pulseCore 2.6s ease-in-out infinite;
    }

    @keyframes rotCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .ring-cw {
      transform-origin: 990px 165px;
      animation: rotCW 24s linear infinite;
    }

    @keyframes rotCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .ring-ccw {
      transform-origin: 990px 165px;
      animation: rotCCW 16s linear infinite;
    }

    @keyframes waveRadar {
      0% { r: 8px; opacity: 0.9; stroke-width: 1.5px; }
      100% { r: 125px; opacity: 0; stroke-width: 0.5px; }
    }
    .radar-wave {
      transform-origin: 990px 165px;
      animation: waveRadar 3.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }

    @keyframes laserRun {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: -1200; }
    }
    .top-laser {
      stroke-dasharray: 200 1000;
      animation: laserRun 4s linear infinite;
    }

    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .led-blink {
      animation: blinkLed 1.4s ease-in-out infinite;
    }
  </style>

  <!-- Background Frame -->
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.8" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="990" cy="165" r="160" fill="url(#reactorAmbient)" />
  <circle cx="180" cy="140" r="140" fill="url(#redAmbient)" opacity="0.3" />

  <!-- Subtle High-Tech Grid Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.75">
    <line x1="50" y1="90" x2="1150" y2="90" />
    <line x1="50" y1="150" x2="1150" y2="150" />
    <line x1="50" y1="210" x2="1150" y2="210" />
    <line x1="50" y1="270" x2="1150" y2="270" />
    <line x1="200" y1="40" x2="200" y2="310" />
    <line x1="450" y1="40" x2="450" y2="310" />
    <line x1="700" y1="40" x2="700" y2="310" />
  </g>

  <!-- Topbar Header -->
  <path d="M 2 16 Q 2 2 16 2 L 1184 2 Q 1198 2 1198 16 L 1198 42 L 2 42 Z" fill="url(#topbarGrad)" stroke="#1e293b" stroke-width="1" />
  <line x1="2" y1="42" x2="1198" y2="42" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5" />
  <line x1="2" y1="42" x2="1198" y2="42" stroke="#00f0ff" stroke-width="2.2" class="top-laser" filter="url(#softGlow)" />

  <!-- Topbar Status Controls & Telemetry -->
  <g transform="translate(30, 22)">
    <circle cx="0" cy="0" r="5.5" fill="#ef4444" />
    <circle cx="20" cy="0" r="5.5" fill="#f59e0b" />
    <circle cx="40" cy="0" r="5.5" fill="#00f0ff" />
    <text x="64" y="5" class="f-mono" font-size="13" font-weight="700" fill="#94a3b8">
      STARK INDUSTRIES // <tspan fill="#f8fafc">AVENGERS INITIATIVE</tspan> — SOFTWARE ENGINEERING DIVISION
    </text>
  </g>

  <g transform="translate(980, 22)">
    <circle cx="0" cy="0" r="4" fill="#00f0ff" class="led-blink" filter="url(#softGlow)" />
    <text x="14" y="5" class="f-mono" font-size="13" font-weight="700" fill="#00f0ff">J.A.R.V.I.S. ONLINE</text>
    <text x="135" y="5" class="f-mono" font-size="13" font-weight="600" fill="#94a3b8">LEVEL 7 ●</text>
  </g>

  <!-- ================= LEFT HERO: AVENGERS EMBLEM & LARGE TEXT ================= -->

  <!-- Avengers Logo Crest -->
  <g transform="translate(56, 75)">
    <rect x="0" y="0" width="84" height="84" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <rect x="4" y="4" width="76" height="76" rx="14" fill="#050811" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6" />
    
    <!-- Avengers Circle & A -->
    <circle cx="42" cy="42" r="30" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-opacity="0.85" />
    <path d="M 42 19 L 55 64 L 47 64 L 44 52 L 32 52 L 30 64 L 22 64 Z M 42 32 L 34 46 L 44 46 Z" fill="#f8fafc" />
    <path d="M 44 46 L 64 46 L 61 52 L 44 52 Z" fill="#ef4444" filter="url(#softGlow)" />
  </g>

  <!-- Big Name Typography (HIGH VISIBILITY: 60px) -->
  <text x="162" y="128" class="f-sans" font-size="60" font-weight="900" letter-spacing="3.5px" fill="#ffffff" filter="url(#softGlow)">
    NAMAN GOYAL
  </text>

  <!-- Role Subtitle (HIGH VISIBILITY: 22px) -->
  <g transform="translate(164, 166)">
    <rect x="-8" y="-18" width="570" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="8" y="5" class="f-mono" font-size="17" font-weight="700" letter-spacing="1.5px" fill="#00f0ff">
      AI/ML STUDENT  |  FULL-STACK DEVELOPER  |  PROBLEM SOLVER
    </text>
  </g>

  <!-- Education & Location Line (HIGH VISIBILITY: 17px) -->
  <g transform="translate(58, 222)">
    <text x="0" y="0" class="f-sans" font-size="17" font-weight="600" fill="#cbd5e1">
      🎓 <tspan fill="#f8fafc" font-weight="700">B.Tech in Computer Science (AI/ML)</tspan> · Mirai School of Technology · Agra, India 🇮🇳
    </text>
  </g>

  <!-- Arsenal Quick Badges (HIGH VISIBILITY: 14px bold pills) -->
  <g transform="translate(58, 252)">
    <!-- Badge 1: C++ DSA -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="158" height="34" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.4" />
      <circle cx="16" cy="17" r="4.5" fill="#ef4444" />
      <text x="28" y="22" class="f-mono" font-size="14" font-weight="700" fill="#f8fafc">C++ &amp; ALGORITHMS</text>
    </g>

    <!-- Badge 2: Full-Stack MERN -->
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="168" height="34" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1.4" />
      <circle cx="16" cy="17" r="4.5" fill="#00f0ff" />
      <text x="28" y="22" class="f-mono" font-size="14" font-weight="700" fill="#f8fafc">FULL-STACK (MERN)</text>
    </g>

    <!-- Badge 3: Applied AI / Vision -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="176" height="34" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4" />
      <circle cx="16" cy="17" r="4.5" fill="#f59e0b" />
      <text x="28" y="22" class="f-mono" font-size="14" font-weight="700" fill="#f8fafc">APPLIED AI &amp; VISION</text>
    </g>

    <!-- Badge 4: Concurrency -->
    <g transform="translate(538, 0)">
      <rect x="0" y="0" width="154" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.4" />
      <circle cx="16" cy="17" r="4.5" fill="#10b981" />
      <text x="28" y="22" class="f-mono" font-size="14" font-weight="700" fill="#f8fafc">ACID SYSTEMS</text>
    </g>
  </g>

  <!-- ================= RIGHT HERO: GLOWING STARK ARC REACTOR ================= -->

  <!-- Radiating Radar Pulse from Arc Reactor -->
  <circle cx="990" cy="175" r="10" fill="none" stroke="#00f0ff" class="radar-wave" />

  <!-- Outer HUD Ring with Calibrations (Counter-Clockwise) -->
  <g class="ring-ccw">
    <circle cx="990" cy="175" r="115" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 14" opacity="0.8" />
    <circle cx="990" cy="175" r="102" fill="none" stroke="#00f0ff" stroke-width="1.4" stroke-dasharray="3 15" opacity="0.6" />
  </g>

  <!-- Middle HUD Ring (Clockwise) -->
  <g class="ring-cw">
    <circle cx="990" cy="175" r="88" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="24 16 8 16" opacity="0.9" />
    <line x1="990" y1="74" x2="990" y2="84" stroke="#ef4444" stroke-width="3" />
    <line x1="990" y1="266" x2="990" y2="276" stroke="#ef4444" stroke-width="3" />
    <line x1="889" y1="175" x2="899" y2="175" stroke="#00f0ff" stroke-width="3" />
    <line x1="1081" y1="175" x2="1091" y2="175" stroke="#00f0ff" stroke-width="3" />
  </g>

  <!-- Inner Arc Reactor Core with 10 Solenoid Electromagnets -->
  <g transform="translate(990, 175)">
    <circle cx="0" cy="0" r="66" fill="#050811" stroke="#00f0ff" stroke-width="2.8" filter="url(#arcGlowFilter)" />
    
    <!-- 8 Solenoids / Power Coils -->
    <rect x="-6" y="-64" width="12" height="10" rx="2" fill="#ef4444" />
    <rect x="-6" y="54" width="12" height="10" rx="2" fill="#ef4444" />
    <rect x="-64" y="-6" width="10" height="12" rx="2" fill="#ef4444" />
    <rect x="54" y="-6" width="10" height="12" rx="2" fill="#ef4444" />

    <g transform="rotate(45)">
      <rect x="-6" y="-64" width="12" height="10" rx="2" fill="#00f0ff" />
      <rect x="-6" y="54" width="12" height="10" rx="2" fill="#00f0ff" />
      <rect x="-64" y="-6" width="10" height="12" rx="2" fill="#00f0ff" />
      <rect x="54" y="-6" width="10" height="12" rx="2" fill="#00f0ff" />
    </g>

    <!-- Core Glowing Center -->
    <circle cx="0" cy="0" r="42" fill="#0a1022" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="0" r="32" fill="url(#arcGlowCore)" class="arc-core-anim" filter="url(#arcGlowFilter)" />
    
    <!-- Center Triangular Prism & Repulsor Dot -->
    <polygon points="0,-16 14,10 -14,10" fill="none" stroke="#ffffff" stroke-width="2.2" />
    <circle cx="0" cy="2" r="5" fill="#ffffff" filter="url(#softGlow)" />
  </g>
</svg>