<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="830" height="260" fill="none">
  <title>Naman Goyal — Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>

    <!-- right-side glow -->
    <radialGradient id="glow" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.20">
        <animate attributeName="stop-opacity" values="0.20;0.08;0.20" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- top border shine -->
    <linearGradient id="top-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- name gradient -->
    <linearGradient id="name-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
      <animate attributeName="x2" values="100%;135%;100%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.85" fill="#21262d"/>
    </pattern>
    <linearGradient id="dots-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dm">
      <rect width="830" height="260" rx="14" fill="url(#dots-fade)"/>
    </mask>

    <!-- typewriter clips -->
    <clipPath id="tw1">
      <rect x="40" y="126" height="28" width="0">
        <animate attributeName="width" values="0;590;590;0;0" keyTimes="0;0.40;0.48;0.50;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="tw2">
      <rect x="40" y="126" height="28" width="0">
        <animate attributeName="width" values="0;0;610;610;0" keyTimes="0;0.52;0.90;0.97;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes floatA {
      0%,100%{ transform:translateY(0) scale(1); opacity:.5; }
      50%{ transform:translateY(-8px) scale(1.12); opacity:.85; }
    }
    @keyframes floatB {
      0%,100%{ transform:translateY(0) scale(1); opacity:.35; }
      50%{ transform:translateY(7px) scale(0.92); opacity:.75; }
    }
    .fa{ animation:floatA 5s ease-in-out infinite; transform-origin:740px 65px; }
    .fb{ animation:floatB 4.2s ease-in-out infinite 1s; transform-origin:690px 190px; }
    .blink{ animation:blink 0.85s step-end infinite; }
    .badge-text{
      font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
      font-size:10.5px; font-weight:600; letter-spacing:2.5px; fill:#7d8590;
    }
    .name{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      font-size:42px; font-weight:800; letter-spacing:-1px; fill:url(#name-g);
    }
    .typing{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      font-size:15px; font-weight:600; fill:#38bdf8; letter-spacing:0.1px;
    }
    .typing2{ fill:#34d399; }
    .bio{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      font-size:12.5px; fill:#7d8590; font-weight:400;
    }
    .avail-dot{ fill:#3fb950; }
    .avail-text{
      font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
      font-size:10px; font-weight:600; fill:#7ee787; letter-spacing:1px;
    }
  </style>

  <!-- Card Base -->
  <rect x="0.5" y="0.5" width="829" height="259" rx="14" fill="url(#bg)" stroke="#21262d"/>
  <rect width="830" height="260" rx="14" fill="url(#glow)"/>
  <rect width="830" height="260" rx="14" fill="url(#dots)" mask="url(#dm)"/>

  <!-- Top Animated Laser Runner -->
  <line x1="14" y1="1" x2="816" y2="1" stroke="url(#top-line)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Location / Desk Badge -->
  <g transform="translate(40, 36)">
    <circle cx="5" cy="5" r="3" fill="#00f0ff"/>
    <text x="16" y="8.5" class="badge-text">SOFTWARE ENGINEER // AGRA / DELHI-NCR, IN</text>
  </g>

  <!-- Name -->
  <text x="40" y="105" class="name">Naman Goyal</text>

  <!-- Typewriter animated subtitles -->
  <g clip-path="url(#tw1)">
    <text x="40" y="145" class="typing">Building Applied AI/ML Systems &amp; Scalable Web Architectures</text>
  </g>
  <g clip-path="url(#tw2)">
    <text x="40" y="145" class="typing typing2">Sharpening Algorithmic Core in C++ &amp; ACID-Compliant Concurrency</text>
  </g>

  <!-- Blinking Cursor -->
  <line x1="42" y1="149" x2="52" y2="149" stroke="#00f0ff" stroke-width="2" class="blink"/>

  <!-- Bio -->
  <text x="40" y="186" class="bio">
    <tspan fill="#e6edf3" font-weight="600">B.Tech CSE (AI/ML)</tspan> @ <tspan fill="#38bdf8">Mirai School of Technology</tspan> · Crafting real-world machine learning systems,
  </text>
  <text x="40" y="204" class="bio">
    data structures in modern C++, and high-concurrency micro-backends with zero race conditions.
  </text>

  <!-- Status Bar (Bottom Left) -->
  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="310" height="18" rx="9" fill="#0f2d1e" stroke="#1f6feb" stroke-opacity="0.3" stroke-width="0.75"/>
    <circle cx="9" cy="9" r="3.5" class="avail-dot">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="12.5" class="avail-text">OPEN FOR SDE &amp; FULL-STACK / AI INTERNSHIPS</text>
  </g>

  <!-- Right Floating Geometric Art (Clean Stark Arc / Tech glyphs) -->
  <g class="fa">
    <circle cx="730" cy="85" r="45" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="730" cy="85" r="28" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="730" cy="85" r="8" fill="#00f0ff" fill-opacity="0.8" filter="url(#soft)"/>
    <polygon points="730,73 740,91 720,91" fill="none" stroke="#34d399" stroke-width="1.2"/>
  </g>

  <g class="fb">
    <rect x="680" y="155" width="55" height="55" rx="10" fill="#0b1320" stroke="#1f2937" stroke-width="1"/>
    <circle cx="707" cy="182" r="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="707" y="186" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#38bdf8">&lt;/&gt;</text>
  </g>
</svg>