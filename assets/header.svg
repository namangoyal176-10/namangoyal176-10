<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="avengersBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>

    <!-- Topbar Gradient -->
    <linearGradient id="hudTopbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#141f36" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Arc Reactor Core Radial Gradient -->
    <radialGradient id="arcCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a5f3fc" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="starkRedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05070e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- HUD Grid Pattern -->
    <pattern id="hudGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="36" cy="36" r="1.2" fill="#00f0ff" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="arcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hud-mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Courier New", monospace; }
    .hud-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    /* Keyframe Animations */
    @keyframes arcPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px #00f0ff); }
    }
    .arc-pulsing {
      transform-origin: 980px 200px;
      animation: arcPulse 3s ease-in-out infinite;
    }

    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hud-ring-cw {
      transform-origin: 980px 200px;
      animation: rotateClockwise 20s linear infinite;
    }

    @keyframes rotateCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .hud-ring-ccw {
      transform-origin: 980px 200px;
      animation: rotateCounter 14s linear infinite;
    }

    @keyframes radarWave {
      0% { r: 10px; opacity: 1; stroke-width: 1.5px; }
      100% { r: 120px; opacity: 0; stroke-width: 0.5px; }
    }
    .arc-radar-ring {
      transform-origin: 980px 200px;
      animation: radarWave 3.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }

    @keyframes pingDot {
      0% { r: 3.5px; opacity: 1; }
      100% { r: 12px; opacity: 0; }
    }
    .ping-led {
      animation: pingDot 2s ease-out infinite;
    }

    @keyframes hudBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .hud-cursor {
      animation: hudBlink 1.1s infinite;
    }

    @keyframes beamSweep {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: -1200; }
    }
    .hud-beam {
      stroke-dasharray: 180 1020;
      animation: beamSweep 4.5s linear infinite;
    }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1198" height="398" rx="16" fill="url(#avengersBg)" stroke="#1e293b" stroke-width="1.6" />

  <!-- Background Ambient Glow Behind Arc Reactor -->
  <circle cx="980" cy="200" r="190" fill="url(#cyanAmbientGlow)" />
  <circle cx="160" cy="180" r="140" fill="url(#starkRedGlow)" opacity="0.3" />

  <!-- HUD Grid Pattern Overlay -->
  <rect x="2" y="44" width="1196" height="310" fill="url(#hudGrid)" />

  <!-- Topbar Header -->
  <path d="M 2 16 Q 2 2 16 2 L 1184 2 Q 1198 2 1198 16 L 1198 44 L 2 44 Z" fill="url(#hudTopbar)" stroke="#1e293b" stroke-width="1" />
  <line x1="2" y1="44" x2="1198" y2="44" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6" />
  <line x1="2" y1="44" x2="1198" y2="44" stroke="#00f0ff" stroke-width="2" class="hud-beam" filter="url(#laserGlow)" />

  <!-- Topbar Status Controls & Telemetry -->
  <g transform="translate(28, 23)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="18" cy="0" r="5" fill="#f59e0b" />
    <circle cx="36" cy="0" r="5" fill="#00f0ff" />
    <text x="60" y="4" class="hud-mono" font-size="12" fill="#94a3b8">
      STARK_HUD // <tspan fill="#f8fafc" font-weight="700">J.A.R.V.I.S. PROTOCOL_V4.2</tspan> — AVENGERS INITIATIVE
    </text>
  </g>

  <g transform="translate(850, 23)">
    <circle cx="0" cy="0" r="3.5" fill="none" stroke="#00f0ff" class="ping-led" />
    <circle cx="0" cy="0" r="3.5" fill="#00f0ff" filter="url(#laserGlow)" />
    <text x="14" y="4" class="hud-mono" font-size="11" fill="#00f0ff" font-weight="700">CORE: ONLINE</text>
    <text x="115" y="4" class="hud-mono" font-size="11" fill="#94a3b8">POWER: <tspan fill="#f8fafc">100%</tspan></text>
    <text x="205" y="4" class="hud-mono" font-size="11" fill="#94a3b8">CLEARANCE: <tspan fill="#ef4444">LEVEL 7</tspan></text>
  </g>

  <!-- ================= LEFT HERO: AVENGERS CREST & PROFILE ================= -->

  <!-- Avengers Iconic A Badge -->
  <g transform="translate(54, 76)">
    <!-- Outer Shield Box -->
    <rect x="0" y="0" width="82" height="82" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.8" />
    <rect x="4" y="4" width="74" height="74" rx="12" fill="#05070e" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6" />
    
    <!-- Avengers Circle & A Symbol -->
    <circle cx="41" cy="41" r="28" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8" />
    <!-- Dynamic Avengers Slanted Arrow A -->
    <path d="M 41 20 L 53 62 L 46 62 L 43 51 L 32 51 L 30 62 L 23 62 Z M 41 33 L 34 46 L 43 46 Z" fill="#f8fafc" />
    <!-- Right Arrow Crossbar Extension -->
    <path d="M 43 46 L 61 46 L 58 51 L 43 51 Z" fill="#ef4444" filter="url(#laserGlow)" />
  </g>

  <!-- Protocol Badge -->
  <g transform="translate(152, 78)">
    <rect x="0" y="0" width="270" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#ef4444" filter="url(#laserGlow)" />
    <text x="24" y="16" class="hud-mono" font-size="11" fill="#94a3b8" letter-spacing="1px">
      DIVISION: <tspan fill="#f8fafc" font-weight="700">SOFTWARE ENGINEERING</tspan>
    </text>
  </g>

  <!-- Name Typography -->
  <text x="152" y="145" class="hud-sans" font-size="52" font-weight="900" letter-spacing="3.5px" fill="#f8fafc">
    NAMAN GOYAL
  </text>

  <!-- Tagline Banner with Blinking HUD Cursor -->
  <g transform="translate(154, 172)">
    <rect x="-6" y="-14" width="530" height="26" rx="4" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="6" y="4" class="hud-mono" font-size="12" font-weight="700" letter-spacing="1.5px" fill="#00f0ff">
      AI/ML ENGINEER  |  FULL-STACK DEVELOPER  |  PROBLEM SOLVER
    </text>
    <rect x="506" y="-8" width="8" height="14" fill="#00f0ff" class="hud-cursor" />
  </g>

  <!-- Tactical Dossier Card (Mirai / B.Tech / Agra) -->
  <g transform="translate(54, 224)">
    <rect x="0" y="0" width="480" height="120" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.4" />
    <line x1="0" y1="28" x2="480" y2="28" stroke="#1e293b" stroke-width="1" />
    
    <!-- Dossier Header -->
    <text x="16" y="19" class="hud-mono" font-size="10.5" fill="#94a3b8" font-weight="700" letter-spacing="1px">
      AGENT DOSSIER // INTEL BRIEF
    </text>
    <circle cx="430" cy="15" r="3" fill="#00f0ff" filter="url(#laserGlow)" />
    <text x="440" y="19" class="hud-mono" font-size="10" fill="#00f0ff" font-weight="700">ACTIVE</text>

    <!-- Field 1 -->
    <text x="16" y="49" class="hud-mono" font-size="11" fill="#94a3b8">ACADEMY</text>
    <text x="130" y="49" class="hud-mono" font-size="11" fill="#f8fafc" font-weight="600">B.Tech CSE (AI/ML Specialization)</text>

    <!-- Field 2 -->
    <text x="16" y="71" class="hud-mono" font-size="11" fill="#94a3b8">CAMPUS</text>
    <text x="130" y="71" class="hud-mono" font-size="11" fill="#f8fafc" font-weight="600">Mirai School of Technology</text>

    <!-- Field 3 -->
    <text x="16" y="93" class="hud-mono" font-size="11" fill="#94a3b8">BASE STATION</text>
    <text x="130" y="93" class="hud-mono" font-size="11" fill="#f8fafc" font-weight="600">Agra, Uttar Pradesh, India [27.18°N]</text>

    <!-- Field 4 -->
    <text x="16" y="113" class="hud-mono" font-size="11" fill="#94a3b8">ARSENAL</text>
    <text x="130" y="113" class="hud-mono" font-size="11" fill="#00f0ff" font-weight="600">C++ (DSA) · Node.js · Express · React · Python</text>
  </g>

  <!-- ================= RIGHT HERO: STARK ARC REACTOR HUD ================= -->

  <!-- Radar Wave Radiating From Arc Reactor -->
  <circle cx="980" cy="200" r="10" fill="none" stroke="#00f0ff" class="arc-radar-ring" />

  <!-- Outer HUD Ring with Tick Marks (Counter-Clockwise) -->
  <g class="hud-ring-ccw">
    <circle cx="980" cy="200" r="135" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 14" opacity="0.8" />
    <circle cx="980" cy="200" r="120" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 18" opacity="0.6" />
  </g>

  <!-- Middle HUD Ring (Clockwise) -->
  <g class="hud-ring-cw">
    <circle cx="980" cy="200" r="102" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="24 16 8 16" opacity="0.85" />
    <!-- Calibrations on HUD ring -->
    <line x1="980" y1="88" x2="980" y2="98" stroke="#ef4444" stroke-width="3" />
    <line x1="980" y1="302" x2="980" y2="312" stroke="#ef4444" stroke-width="3" />
    <line x1="868" y1="200" x2="878" y2="200" stroke="#00f0ff" stroke-width="3" />
    <line x1="1082" y1="200" x2="1092" y2="200" stroke="#00f0ff" stroke-width="3" />
  </g>

  <!-- Inner High-Tech Reactor Ring with 10 Electromagnets -->
  <g transform="translate(980, 200)">
    <circle cx="0" cy="0" r="75" fill="#05070e" stroke="#00f0ff" stroke-width="2.5" filter="url(#arcGlow)" />
    
    <!-- 10 Solenoid / Arc Coils -->
    <rect x="-7" y="-72" width="14" height="12" rx="2" fill="#ef4444" />
    <rect x="-7" y="60" width="14" height="12" rx="2" fill="#ef4444" />
    <rect x="-72" y="-7" width="12" height="14" rx="2" fill="#ef4444" />
    <rect x="60" y="-7" width="12" height="14" rx="2" fill="#ef4444" />

    <g transform="rotate(36)">
      <rect x="-7" y="-72" width="14" height="12" rx="2" fill="#0284c7" />
      <rect x="-7" y="60" width="14" height="12" rx="2" fill="#0284c7" />
    </g>
    <g transform="rotate(72)">
      <rect x="-7" y="-72" width="14" height="12" rx="2" fill="#0284c7" />
      <rect x="-7" y="60" width="14" height="12" rx="2" fill="#0284c7" />
    </g>
    <g transform="rotate(108)">
      <rect x="-7" y="-72" width="14" height="12" rx="2" fill="#0284c7" />
      <rect x="-7" y="60" width="14" height="12" rx="2" fill="#0284c7" />
    </g>
    <g transform="rotate(144)">
      <rect x="-7" y="-72" width="14" height="12" rx="2" fill="#0284c7" />
      <rect x="-7" y="60" width="14" height="12" rx="2" fill="#0284c7" />
    </g>

    <!-- Core Glowing Center -->
    <circle cx="0" cy="0" r="48" fill="#0a0f1d" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="0" r="38" fill="url(#arcCore)" class="arc-pulsing" filter="url(#arcGlow)" />
    
    <!-- Center Triangular Power Prism -->
    <polygon points="0,-18 16,12 -16,12" fill="none" stroke="#f8fafc" stroke-width="2" />
    <circle cx="0" cy="2" r="6" fill="#f8fafc" filter="url(#laserGlow)" />
  </g>

  <!-- Reactor HUD Labels -->
  <g class="hud-mono" font-size="10" fill="#94a3b8">
    <text x="870" y="80">P-OUTPUT: <tspan fill="#00f0ff">3.0 GJ/S</tspan></text>
    <text x="1000" y="80">CONTAINMENT: <tspan fill="#f8fafc">100%</tspan></text>
    <text x="870" y="332">VIBRANIUM CORE: <tspan fill="#ef4444">SYNCHRONIZED</tspan></text>
    <text x="1040" y="332">ARC: <tspan fill="#00f0ff">MARK LXXXV</tspan></text>
  </g>

  <!-- ================= BOTTOM HUD TICKER / STATUS TAPE ================= -->

  <g transform="translate(0, 354)">
    <rect x="1" y="0" width="1198" height="44" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
    <path d="M 1 0 L 1199 0 L 1199 32 Q 1199 44 1184 44 L 16 44 Q 1 44 1 32 Z" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
    <line x1="2" y1="0" x2="1198" y2="0" stroke="#1e293b" stroke-width="1" />

    <!-- Protocol 1 -->
    <g transform="translate(48, 27)">
      <circle cx="0" cy="-4" r="3.5" fill="#00f0ff" filter="url(#laserGlow)" />
      <text x="14" y="0" class="hud-mono" font-size="11" fill="#94a3b8">PROTOCOL: <tspan fill="#f8fafc" font-weight="700">CODE</tspan></text>
      <text x="140" y="0" class="hud-mono" font-size="11" fill="#00f0ff" font-weight="700">HIGH-PERFORMANCE</text>
    </g>

    <line x1="310" y1="10" x2="310" y2="34" stroke="#1e293b" stroke-width="1" />

    <!-- Protocol 2 -->
    <g transform="translate(340, 27)">
      <circle cx="0" cy="-4" r="3.5" fill="#ef4444" filter="url(#laserGlow)" />
      <text x="14" y="0" class="hud-mono" font-size="11" fill="#94a3b8">PROTOCOL: <tspan fill="#f8fafc" font-weight="700">BUILD</tspan></text>
      <text x="140" y="0" class="hud-mono" font-size="11" fill="#ef4444" font-weight="700">FULL-STACK SYSTEMS</text>
    </g>

    <line x1="620" y1="10" x2="620" y2="34" stroke="#1e293b" stroke-width="1" />

    <!-- Protocol 3 -->
    <g transform="translate(650, 27)">
      <circle cx="0" cy="-4" r="3.5" fill="#f59e0b" filter="url(#laserGlow)" />
      <text x="14" y="0" class="hud-mono" font-size="11" fill="#94a3b8">PROTOCOL: <tspan fill="#f8fafc" font-weight="700">SOLVE</tspan></text>
      <text x="140" y="0" class="hud-mono" font-size="11" fill="#f59e0b" font-weight="700">DSA &amp; APPLIED AI</text>
    </g>

    <line x1="910" y1="10" x2="910" y2="34" stroke="#1e293b" stroke-width="1" />

    <!-- Protocol 4 Status -->
    <g transform="translate(940, 27)">
      <rect x="0" y="-14" width="220" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="1" class="hud-mono" font-size="10.5" fill="#94a3b8">
        INITIATIVE: <tspan fill="#00f0ff" font-weight="700">AVENGERS ASSEMBLE</tspan>
      </text>
    </g>
  </g>
</svg>