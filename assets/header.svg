<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060714" />
      <stop offset="40%" stop-color="#0b102b" />
      <stop offset="75%" stop-color="#140f2d" />
      <stop offset="100%" stop-color="#1b0a24" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#ff0077" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Topbar Gradient -->
    <linearGradient id="topbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b102b" />
      <stop offset="50%" stop-color="#18133a" />
      <stop offset="100%" stop-color="#1b0a24" />
    </linearGradient>

    <!-- Vibrant Name Gradient (Cyan -> Violet -> Hot Pink) -->
    <linearGradient id="vibrantName" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#ff2e79" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Subtitle Pill Gradient -->
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Arc Reactor Core Glow -->
    <radialGradient id="arcGlowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#00f0ff" />
      <stop offset="90%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Vibrant Nebula Glows -->
    <radialGradient id="cyanNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#060714" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="magentaNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0077" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060714" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#060714" stop-opacity="0" />
    </radialGradient>

    <!-- Multi-Color Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b1" />
      <feGaussianBlur stdDeviation="9" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .f-mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace; }
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    @keyframes pulseReactor {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.09); opacity: 1; filter: drop-shadow(0 0 18px #00f0ff); }
    }
    .reactor-pulse {
      transform-origin: 990px 170px;
      animation: pulseReactor 2.5s ease-in-out infinite;
    }

    @keyframes rotCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .ring-cw {
      transform-origin: 990px 170px;
      animation: rotCW 20s linear infinite;
    }

    @keyframes rotCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .ring-ccw {
      transform-origin: 990px 170px;
      animation: rotCCW 14s linear infinite;
    }

    @keyframes radarWave {
      0% { r: 10px; opacity: 1; stroke-width: 1.8px; }
      100% { r: 130px; opacity: 0; stroke-width: 0.5px; }
    }
    .wave-anim {
      transform-origin: 990px 170px;
      animation: radarWave 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }

    @keyframes beamSlide {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: -1200; }
    }
    .top-laser-beam {
      stroke-dasharray: 220 980;
      animation: beamSlide 3.8s linear infinite;
    }

    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .led-blink {
      animation: blinkLed 1.2s ease-in-out infinite;
    }
  </style>

  <!-- Background Base Frame -->
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="url(#cosmicBg)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Vibrant Nebula Ambient Glows -->
  <circle cx="990" cy="170" r="170" fill="url(#cyanNebula)" />
  <circle cx="190" cy="140" r="150" fill="url(#magentaNebula)" />
  <circle cx="560" cy="200" r="140" fill="url(#goldNebula)" />

  <!-- High-Tech Cosmic Grid -->
  <g opacity="0.16" stroke="#8b5cf6" stroke-width="0.75">
    <line x1="40" y1="90" x2="1160" y2="90" />
    <line x1="40" y1="150" x2="1160" y2="150" />
    <line x1="40" y1="210" x2="1160" y2="210" />
    <line x1="40" y1="270" x2="1160" y2="270" />
    <line x1="180" y1="42" x2="180" y2="320" />
    <line x1="440" y1="42" x2="440" y2="320" />
    <line x1="720" y1="42" x2="720" y2="320" />
  </g>

  <!-- Topbar Header -->
  <path d="M 2 18 Q 2 2 18 2 L 1182 2 Q 1198 2 1198 18 L 1198 42 L 2 42 Z" fill="url(#topbarGrad)" stroke="#1e1b4b" stroke-width="1" />
  <line x1="2" y1="42" x2="1198" y2="42" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.5" />
  <line x1="2" y1="42" x2="1198" y2="42" stroke="url(#vibrantName)" stroke-width="2.4" class="top-laser-beam" filter="url(#softGlow)" />

  <!-- Topbar Left: Avengers Traffic Lights & Division -->
  <g transform="translate(32, 22)">
    <circle cx="0" cy="0" r="5.5" fill="#ff0055" filter="url(#softGlow)" />
    <circle cx="20" cy="0" r="5.5" fill="#f59e0b" filter="url(#softGlow)" />
    <circle cx="40" cy="0" r="5.5" fill="#00f0ff" filter="url(#softGlow)" />
    <circle cx="60" cy="0" r="5.5" fill="#10b981" filter="url(#softGlow)" />
    <text x="82" y="5" class="f-mono" font-size="13" font-weight="700" fill="#cbd5e1">
      STARK TECH // <tspan fill="#00f0ff">AVENGERS INITIATIVE</tspan> — SOFTWARE ENGINEERING DIVISION
    </text>
  </g>

  <!-- Topbar Right: Status Telemetry -->
  <g transform="translate(1168, 22)" text-anchor="end">
    <circle cx="-205" cy="0" r="4" fill="#00f0ff" class="led-blink" filter="url(#softGlow)" />
    <text x="0" y="5" class="f-mono" font-size="12.5" font-weight="700">
      <tspan fill="#00f0ff">J.A.R.V.I.S. ONLINE</tspan>
      <tspan fill="#8b5cf6"> // </tspan>
      <tspan fill="#ff0055">LEVEL 7 ●</tspan>
    </text>
  </g>

  <!-- ================= LEFT HERO: AVENGERS LOGO & VIBRANT TEXT ================= -->

  <!-- Colorful Avengers Crest -->
  <g transform="translate(56, 70)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="#0f0c29" stroke="url(#vibrantName)" stroke-width="2.2" filter="url(#softGlow)" />
    <rect x="4" y="4" width="80" height="80" rx="16" fill="#070719" />
    
    <!-- Avengers Circle & Symbol -->
    <circle cx="44" cy="44" r="32" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.9" />
    <path d="M 44 20 L 57 67 L 49 67 L 46 54 L 33 54 L 31 67 L 23 67 Z M 44 33 L 36 48 L 46 48 Z" fill="#ffffff" />
    <path d="M 46 48 L 67 48 L 64 54 L 46 54 Z" fill="#ff0055" filter="url(#softGlow)" />
  </g>

  <!-- Big Name in Lush Multi-Color Gradient (62px) -->
  <text x="166" y="128" class="f-sans" font-size="62" font-weight="900" letter-spacing="3.5px" fill="url(#vibrantName)" filter="url(#neonGlow)">
    NAMAN GOYAL
  </text>

  <!-- Colorful Role Subtitle Pill -->
  <g transform="translate(166, 148)">
    <rect x="0" y="0" width="590" height="36" rx="10" fill="#110d2e" stroke="url(#subtitleGrad)" stroke-width="1.6" filter="url(#softGlow)" />
    <text x="295" y="23" text-anchor="middle" class="f-mono" font-size="14.5" font-weight="800" letter-spacing="1.5px" fill="#ffffff">
      <tspan fill="#00f0ff">AI/ML ENGINEER</tspan> · <tspan fill="#facc15">FULL-STACK DEVELOPER</tspan> · <tspan fill="#ff2e79">PROBLEM SOLVER</tspan>
    </text>
  </g>

  <!-- Education & Campus Line (Warm, Readable & High Contrast) -->
  <g transform="translate(58, 218)">
    <text x="0" y="0" class="f-sans" font-size="16.5" font-weight="600" fill="#e2e8f0">
      🎓 <tspan fill="#38bdf8" font-weight="700">B.Tech in Computer Science (AI/ML)</tspan> · <tspan fill="#c084fc">Mirai School of Technology</tspan> · Agra / Delhi-NCR 🇮🇳
    </text>
  </g>

  <!-- Colorful Weapon Badges (Each with its own vibrant superhero identity) -->
  <g transform="translate(58, 248)">
    <!-- Badge 1: C++ DSA (Iron Man Red) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="38" rx="10" fill="#200d17" stroke="#ff0055" stroke-width="1.8" filter="url(#softGlow)" />
      <circle cx="20" cy="19" r="5" fill="#ff0055" />
      <text x="98" y="24" text-anchor="middle" class="f-mono" font-size="13" font-weight="800" fill="#ffffff">C++ &amp; ALGORITHMS</text>
    </g>

    <!-- Badge 2: Full-Stack MERN (Thor Electric Blue) -->
    <g transform="translate(196, 0)">
      <rect x="0" y="0" width="180" height="38" rx="10" fill="#0b1e33" stroke="#00f0ff" stroke-width="1.8" filter="url(#softGlow)" />
      <circle cx="20" cy="19" r="5" fill="#00f0ff" />
      <text x="98" y="24" text-anchor="middle" class="f-mono" font-size="13" font-weight="800" fill="#ffffff">FULL-STACK (MERN)</text>
    </g>

    <!-- Badge 3: Applied AI & Vision (Infinity Stone Purple) -->
    <g transform="translate(392, 0)">
      <rect x="0" y="0" width="185" height="38" rx="10" fill="#1e1035" stroke="#a855f7" stroke-width="1.8" filter="url(#softGlow)" />
      <circle cx="20" cy="19" r="5" fill="#a855f7" />
      <text x="100" y="24" text-anchor="middle" class="f-mono" font-size="13" font-weight="800" fill="#ffffff">APPLIED AI &amp; VISION</text>
    </g>

    <!-- Badge 4: Concurrency (Time Stone Green) -->
    <g transform="translate(593, 0)">
      <rect x="0" y="0" width="175" height="38" rx="10" fill="#09241b" stroke="#10b981" stroke-width="1.8" filter="url(#softGlow)" />
      <circle cx="20" cy="19" r="5" fill="#10b981" />
      <text x="96" y="24" text-anchor="middle" class="f-mono" font-size="13" font-weight="800" fill="#ffffff">ACID CONCURRENCY</text>
    </g>
  </g>

  <!-- ================= RIGHT HERO: GLOWING QUANTUM ARC REACTOR ================= -->

  <!-- Radiating Cyan Energy Wave -->
  <circle cx="990" cy="175" r="10" fill="none" stroke="#00f0ff" class="wave-anim" />

  <!-- Outer HUD Ring (Counter-Clockwise - Electric Purple & Blue) -->
  <g class="ring-ccw">
    <circle cx="990" cy="175" r="118" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-dasharray="8 14" opacity="0.85" />
    <circle cx="990" cy="175" r="105" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 16" opacity="0.8" />
  </g>

  <!-- Middle HUD Ring with 6 Infinity Energy Nodes (Clockwise - Amber & Rose) -->
  <g class="ring-cw">
    <circle cx="990" cy="175" r="90" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="24 16 10 16" opacity="0.9" />
    
    <!-- 6 Infinity Nodes -->
    <circle cx="990" cy="85" r="5" fill="#3b82f6" filter="url(#softGlow)" />   <!-- Space: Blue -->
    <circle cx="1068" cy="130" r="5" fill="#ff0055" filter="url(#softGlow)" /> <!-- Reality: Red -->
    <circle cx="1068" cy="220" r="5" fill="#a855f7" filter="url(#softGlow)" /> <!-- Power: Purple -->
    <circle cx="990" cy="265" r="5" fill="#facc15" filter="url(#softGlow)" /> <!-- Mind: Yellow -->
    <circle cx="912" cy="220" r="5" fill="#10b981" filter="url(#softGlow)" /> <!-- Time: Green -->
    <circle cx="912" cy="130" r="5" fill="#f97316" filter="url(#softGlow)" /> <!-- Soul: Orange -->
  </g>

  <!-- Inner Arc Reactor Core with 8 Multi-Color Solenoid Coils -->
  <g transform="translate(990, 175)">
    <circle cx="0" cy="0" r="68" fill="#08091a" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)" />
    
    <!-- 8 Vibrant Solenoid Coils -->
    <rect x="-6" y="-66" width="12" height="11" rx="2" fill="#ff0055" />
    <rect x="-6" y="55" width="12" height="11" rx="2" fill="#ff0055" />
    <rect x="-66" y="-6" width="11" height="12" rx="2" fill="#00f0ff" />
    <rect x="55" y="-6" width="11" height="12" rx="2" fill="#00f0ff" />

    <g transform="rotate(45)">
      <rect x="-6" y="-66" width="12" height="11" rx="2" fill="#a855f7" />
      <rect x="-6" y="55" width="12" height="11" rx="2" fill="#a855f7" />
      <rect x="-66" y="-6" width="11" height="12" rx="2" fill="#f59e0b" />
      <rect x="55" y="-6" width="11" height="12" rx="2" fill="#f59e0b" />
    </g>

    <!-- Core Glowing Center -->
    <circle cx="0" cy="0" r="44" fill="#0d102e" stroke="#00f0ff" stroke-width="2.2" />
    <circle cx="0" cy="0" r="34" fill="url(#arcGlowCore)" class="reactor-pulse" filter="url(#neonGlow)" />
    
    <!-- Center Triangular Prism & Repulsor Dot -->
    <polygon points="0,-17 15,11 -15,11" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="0" cy="2" r="5.5" fill="#ffffff" filter="url(#softGlow)" />
  </g>
</svg>