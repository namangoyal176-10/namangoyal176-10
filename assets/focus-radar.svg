<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 135" width="830" height="135" fill="none">
  <title>Current Focus &amp; Roadmap</title>
  <defs>
    <linearGradient id="rbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="rlaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGreen {
      0%,100% { opacity: 1; r: 3.5; }
      50% { opacity: 0.3; r: 5; }
    }
    .pulse-dot { animation: pulseGreen 2.4s ease-in-out infinite; transform-origin: 24px 22px; }
    .label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #38bdf8;
    }
    .cell-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px; font-weight: 700; fill: #e6edf3;
    }
    .cell-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11.5px; font-weight: 400; fill: #7d8590;
    }
  </style>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="829" height="134" rx="10" fill="url(#rbg)" stroke="#21262d" stroke-width="1"/>
  <line x1="12" y1="1" x2="818" y2="1" stroke="url(#rlaser)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Header row -->
  <circle cx="24" cy="22" r="3.5" fill="#00f0ff" class="pulse-dot"/>
  <circle cx="24" cy="22" r="2" fill="#38bdf8"/>
  <text x="36" y="25.5" class="label">CURRENT FOCUS &amp; ROADMAP</text>

  <line x1="20" y1="38" x2="810" y2="38" stroke="#21262d" stroke-width="0.75"/>

  <!-- Column 1 -->
  <g transform="translate(24, 52)">
    <text x="0" y="14" class="cell-title">KisanMitra AI</text>
    <text class="cell-desc">
      <tspan x="0" y="32">Deep Learning Vision &amp; Agro-</tspan>
      <tspan x="0" y="48">Economic forecasting · Active dev</tspan>
    </text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="275" y1="46" x2="275" y2="118" stroke="#21262d" stroke-width="0.75"/>

  <!-- Column 2 -->
  <g transform="translate(295, 52)">
    <text x="0" y="14" class="cell-title">Algorithms &amp; C++</text>
    <text class="cell-desc">
      <tspan x="0" y="32">Graph traversal, dynamic programming</tspan>
      <tspan x="0" y="48">&amp; STL complexity optimization</tspan>
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="550" y1="46" x2="550" y2="118" stroke="#21262d" stroke-width="0.75"/>

  <!-- Column 3 -->
  <g transform="translate(570, 52)">
    <text x="0" y="14" class="cell-title">ACID Concurrency &amp; MERN</text>
    <text class="cell-desc">
      <tspan x="0" y="32">Zero race condition architectures,</tspan>
      <tspan x="0" y="48">Node.js, Express &amp; React backends</tspan>
    </text>
  </g>
</svg>