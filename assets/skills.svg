<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 148" width="830" height="148" fill="none">
  <title>Engineering Arsenal &amp; Skills</title>
  <defs>
    <linearGradient id="bg-col" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="l1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="l2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="l3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pdot { 0%,100%{r:2.5;opacity:1} 50%{r:4;opacity:0.2} }
    .col-label{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:10px; font-weight:700; letter-spacing:2px; }
    .chip-t{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:10.5px; font-weight:500; fill:#adbac7; }
    .d1{ animation:pdot 2s infinite; transform-origin:18px 22px; }
    .d2{ animation:pdot 2.4s infinite; transform-origin:305px 22px; }
    .d3{ animation:pdot 2.8s infinite; transform-origin:591px 22px; }
  </style>

  <!-- Column 1: Core Languages (Cyan) -->
  <rect x="0.5" y="0.5" width="257" height="147" rx="12" fill="url(#bg-col)" stroke="#21262d"/>
  <line x1="14" y1="1" x2="244" y2="1" stroke="url(#l1)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="18" cy="22" r="2.5" fill="#00f0ff" class="d1"/>
  <text x="28" y="26" class="col-label" fill="#38bdf8">CORE LANGUAGES</text>
  <!-- chips row 1 -->
  <rect x="16" y="44" width="48" height="20" rx="10" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)"/>
  <text x="40" y="58" text-anchor="middle" class="chip-t">C++20</text>
  <rect x="70" y="44" width="60" height="20" rx="10" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)"/>
  <text x="100" y="58" text-anchor="middle" class="chip-t">Python</text>
  <rect x="136" y="44" width="86" height="20" rx="10" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)"/>
  <text x="179" y="58" text-anchor="middle" class="chip-t">JavaScript</text>
  <!-- row 2 -->
  <rect x="16" y="74" width="88" height="20" rx="10" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)"/>
  <text x="60" y="88" text-anchor="middle" class="chip-t">TypeScript</text>
  <rect x="110" y="74" width="82" height="20" rx="10" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)"/>
  <text x="151" y="88" text-anchor="middle" class="chip-t">C++ (STL)</text>

  <!-- Column 2: Web &amp; Systems (Emerald) -->
  <rect x="287.5" y="0.5" width="257" height="147" rx="12" fill="url(#bg-col)" stroke="#21262d"/>
  <line x1="301" y1="1" x2="531" y2="1" stroke="url(#l2)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="305" cy="22" r="2.5" fill="#10b981" class="d2"/>
  <text x="315" y="26" class="col-label" fill="#34d399">WEB &amp; SYSTEMS</text>
  <!-- row 1 -->
  <rect x="303" y="44" width="68" height="20" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
  <text x="337" y="58" text-anchor="middle" class="chip-t">Node.js</text>
  <rect x="379" y="44" width="70" height="20" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
  <text x="414" y="58" text-anchor="middle" class="chip-t">Express</text>
  <!-- row 2 -->
  <rect x="303" y="74" width="56" height="20" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
  <text x="331" y="88" text-anchor="middle" class="chip-t">React</text>
  <rect x="367" y="74" width="74" height="20" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
  <text x="404" y="88" text-anchor="middle" class="chip-t">MongoDB</text>
  <!-- row 3 -->
  <rect x="303" y="104" width="78" height="20" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
  <text x="342" y="118" text-anchor="middle" class="chip-t">REST APIs</text>
  <rect x="389" y="104" width="46" height="20" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
  <text x="412" y="118" text-anchor="middle" class="chip-t">EJS</text>

  <!-- Column 3: AI &amp; Tooling (Gold) -->
  <rect x="573.5" y="0.5" width="256" height="147" rx="12" fill="url(#bg-col)" stroke="#21262d"/>
  <line x1="587" y1="1" x2="816" y2="1" stroke="url(#l3)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="591" cy="22" r="2.5" fill="#f59e0b" class="d3"/>
  <text x="601" y="26" class="col-label" fill="#fbbf24">AI &amp; TOOLING</text>
  <!-- row 1 -->
  <rect x="589" y="44" width="68" height="20" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.25)"/>
  <text x="623" y="58" text-anchor="middle" class="chip-t">OpenCV</text>
  <rect x="665" y="44" width="66" height="20" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.25)"/>
  <text x="698" y="58" text-anchor="middle" class="chip-t">FastAPI</text>
  <!-- row 2 -->
  <rect x="589" y="74" width="72" height="20" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.25)"/>
  <text x="625" y="88" text-anchor="middle" class="chip-t">NetworkX</text>
  <rect x="669" y="74" width="94" height="20" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.25)"/>
  <text x="716" y="88" text-anchor="middle" class="chip-t">Git / GitHub</text>
  <!-- row 3 -->
  <rect x="589" y="104" width="58" height="20" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.25)"/>
  <text x="618" y="118" text-anchor="middle" class="chip-t">Vercel</text>
  <rect x="655" y="104" width="68" height="20" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.25)"/>
  <text x="689" y="118" text-anchor="middle" class="chip-t">VS Code</text>
</svg>